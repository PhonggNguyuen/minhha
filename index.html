<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10</title>
    <link rel="stylesheet" href="./stylse.css">
</head>
<body>
    <div id="start-screen">
        <button id="start-button">Bắt đầu</button>
    </div>

    <audio id="bg-music">
        <source src="./music.mp3" type="audio/mpeg">
    </audio>
    <audio id="bg-music2">
        <source src="./music2.mp3" type="audio/mpeg">
    </audio>

    <div class="poem-container" id="poem-container" style="display: none;">
        <div class="poem" id="current-line"></div>
    </div>

    <div class="content-container" id="content-container" style="display: none;">
        <div class="main-box">
            <div class="calendar" id="calendar">
                <h3>Tháng 10 - 2025</h3>
                <table>
                    <tr><th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>CN</th></tr>
                    <tr><td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
                    <tr><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td></tr>
                    <tr><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td>19</td></tr>
                    <tr><td class="highlight">20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td>26</td></tr>
                    <tr><td>27</td><td>28</td><td>29</td><td>30</td><td>31</td><td></td><td></td></tr>
                </table>
            </div>
            
            <div class="image-container">
                <img src="anh2.jpg" class="image" id="image2">
                <img src="anh3.jpg" class="image" id="image3">
                <img src="anh4.jpg" class="image" id="image4">
                <img src="anh1.jpg" class="image" id="image1">
            </div>
        </div>
    </div>

    <div class="greeting" id="greeting" style="display: none;">Chúc em 20/10 vui vẻ!</div>
    <div class="love-message" id="love-message" style="display: none;">Anh yêu em!</div>
    <div id="restart-button" style="display: none;">
        <button onclick="restart()">Quay lại từ đầu</button>
    </div>

    <script>
        const poemLines = [
            "Em  à, hôm nay là ngày của em!",
            "Anh chúc em một ngày 20/10 thật tươi vui",
            "Cảm ơn em đã đến và làm cuộc sống anh",
            "Trở nên dịu dàng, ấm áp hơn bao giờ hết.",
            "Anh biết em đã chịu đựng nhiều,",
            "Đã hi sinh nhiều để ở bên anh.",
            "Những điều đó, anh không bao giờ quên.",
            "Mỗi ngày bên em là một ngày đặc biệt,",
            "Nhưng anh muốn nói rằng em luôn xứng đáng",
            "Được yêu thương và trân trọng hơn thế nữa.",
            "Mong em chân cứng đá mềm",
            "Luôn giữ được nụ cười ấy",
            "Luôn tìm thấy bình yên và hạnh phúc",
            "Trong những điều nhỏ nhặt mỗi ngày.",
            "Anh yêu em rất nhiều." 
        ];

        const images = document.querySelectorAll('.image');
        const contentContainer = document.getElementById('content-container');
        const poemContainer = document.getElementById('poem-container');
        const currentLineElement = document.getElementById('current-line');
        const greeting = document.getElementById('greeting');
        const loveMessage = document.getElementById('love-message');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        const music = document.getElementById('bg-music');
        const music2 = document.getElementById('bg-music2');
        const restartButton = document.getElementById('restart-button');
        const calendar = document.getElementById('calendar');

        const messages = [
            'Happy Vietnam Women\'s Day! 💕',
            'October 20th - Your Day! 🌹',
            'Forever by your side! ❤️',
            'Love you so much! 😘',
            'Wishing you beauty always! ✨',
            'Enjoy October 20th! 🎉',
            'You are my everything! 💖',
            'Always shining, my love! 🌟',
            'Be happy forever! 😊',
            'My heart is yours! 💞'
        ];

        let currentLineIndex = 0;
        let currentImage = 0;

        // Khi music.mp3 kết thúc, reload trang
        music.addEventListener('ended', function() {
            location.reload();
        });

        // Khi music2.mp3 kết thúc, tăng âm lượng music.mp3 sau 3 giây
        music2.addEventListener('ended', function() {
            setTimeout(() => {
                music.volume = 0.4; // Tăng âm lượng music.mp3 trở lại
            }, 2000);
            setTimeout(() => {
                music.volume = 0.6; // Tăng âm lượng music.mp3 trở lại
            }, 2500);
            setTimeout(() => {
                music.volume = 0.8; // Tăng âm lượng music.mp3 trở lại
            }, 2000);
            setTimeout(() => {
                music.volume = 1.0; // Tăng âm lượng music.mp3 trở lại
            }, 3000);
        });

        function showTextByLetter(element, text, speed = 100, callback) {
            let index = 0;
            element.textContent = '';
            
            function addLetter() {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;
                    setTimeout(addLetter, speed);
                } else {
                    if (callback) callback();
                }
            }
            addLetter();
        }

        function showPoemLineByLine() {
            if (currentLineIndex < poemLines.length) {
                const line = poemLines[currentLineIndex];
                
                currentLineElement.style.opacity = '0';
                currentLineElement.textContent = '';
                
                setTimeout(() => {
                    currentLineElement.style.opacity = '1';
                    currentLineElement.style.transition = 'opacity 0.5s';
                    
                    showTextByLetter(currentLineElement, line, 80, () => {
                        setTimeout(() => {
                            currentLineElement.style.opacity = '0';
                            setTimeout(() => {
                                currentLineIndex++;
                                showPoemLineByLine();
                            }, 500);
                        }, 600);
                    });
                }, 100);
                
            } else {
                setTimeout(() => {
                    poemContainer.style.display = 'none';
                    contentContainer.style.display = 'block';
                    greeting.style.display = 'block';
                    document.body.classList.add('dark');
                    
                    showCalendarFirst();
                    startSparkles();
                }, 1000);
            }
        }

        function showCalendarFirst() {
            calendar.style.opacity = '1';
            calendar.style.transition = 'opacity 0.5s';
            
            setTimeout(() => {
                showNextImage();
                
                calendar.style.opacity = '0';
                calendar.style.transition = 'opacity 2s';
                
                setTimeout(() => {
                    calendar.style.display = 'none';
                }, 2000);
                
            }, 4000);
        }

        function showNextImage() {
            if (currentImage < images.length) {
                images[currentImage].classList.add('show');
                currentImage++;
                setTimeout(showNextImage, 3000);
            } else {
                setTimeout(() => {
                    loveMessage.style.display = 'block';
                    loveMessage.classList.add('show');
                    restartButton.style.display = 'block';
                }, 2000);
            }
        }

        function createFallingText() {
            const text = messages[Math.floor(Math.random() * messages.length)];
            const fallingText = document.createElement('div');
            fallingText.className = 'falling-text';
            fallingText.textContent = text;
            fallingText.style.left = `${Math.random() * 100}vw`;
            fallingText.style.animationDuration = (Math.random() * 4 + 3) + 's';
            fallingText.style.fontSize = (Math.random() * 10 + 20) + 'px';
            document.body.appendChild(fallingText);
            setTimeout(() => fallingText.remove(), 7000);
        }

        function startFallingText() {
            createFallingText();
            setTimeout(startFallingText, 300);
        }

        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const size = Math.random() * 5 + 3;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${Math.random() * 100}vw`;
            sparkle.style.top = `${Math.random() * 100}vh`;
            sparkle.style.animationDuration = `${Math.random() * 1 + 1}s`;
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 4000);
        }

        function startSparkles() {
            createSparkle();
            createSparkle();
            createSparkle();
            setTimeout(startSparkles, 150);
        }

        function restart() {
            location.reload();
        }

        startButton.addEventListener('click', () => {
            music.volume = 1.0; // Đặt âm lượng ban đầu cho music.mp3
            music.play().catch(err => console.log('Không phát được music.mp3:', err));
            startScreen.style.display = 'none';
            startFallingText();
            setTimeout(() => {
                // Phát music2.mp3 trước và giảm âm lượng music.mp3
                music.volume = 0.3; // Giảm âm lượng music.mp3
                music2.volume = 1.0; // Đặt âm lượng music2.mp3
                music2.play().catch(err => console.log('Không phát được music2.mp3:', err));
                // Hiển thị bài thơ sau 2 giây
                setTimeout(() => {
                    poemContainer.style.display = 'block';
                    showPoemLineByLine();
                }, 5000);
            }, 11000);
        });
    </script>
</body>
</html>
